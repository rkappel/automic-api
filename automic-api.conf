###############################################################################
# Automic API – Configuration file
###############################################################################

###############################################################################
# Common settings (apply globally)
###############################################################################
[common]

# Maximum total runtime for a single REST call (curl --max-time)
# Type: integer (seconds)
timeout = 600

# Connection timeout for REST calls (curl --connect-timeout)
# Type: integer (seconds)
connect_timeout = 2

# Number of retry attempts for failed REST calls
# Type: integer
retry = 2

# Delay between retries
# Type: integer (seconds)
retry_delay = 120

# Log file location
# Type: absolute or relative path
log_file = ./automic-api.log

# Number of days to keep rotated logs
# (NOTE: value is read but currently not enforced in code)
# Type: integer
log_keep_days = 7


###############################################################################
# Environment definitions
# One section per AE environment (name used with -e)
###############################################################################

###############################################################################
# Example: PROD environment
###############################################################################
[prod]
# Base URL of the Automic REST API (required)
# Example: https://ae-prod.example.com:8443/ae/api/v1
;url = https://ae-prod.example.com:8443/ae/api/v1

# Authentication method
# Allowed values (as per code):
#   token
#   basic_b64
#   basic_userpass
auth_method = token

# --- Authentication variants (only one used depending on auth_method) ---

# Bearer token authentication
auth_token = REPLACE_WITH_BEARER_TOKEN

# Pre-encoded Basic Auth (base64 of user:password)
auth_b64 = REPLACE_WITH_BASE64_STRING

# Username/password (encoded at runtime)
user = AE_USER
pass = AE_PASSWORD


###############################################################################
# Example: TEST environment
###############################################################################
[test]

url = https://ae-test.example.com:8443/ae/api/v1
auth_method = basic_userpass
user = testuser
pass = testpassword